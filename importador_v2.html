<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>

Importador V2

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link
rel="stylesheet"
href="css/importador_v2.css">

</head>

<body class="bg-light">

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">

<i class="fa fa-file-excel"></i>

Importador de Servidores V2

</h3>

</div>

<div class="card-body">

<div class="mb-4">

<div
id="dropZone"
class="border border-3 border-primary rounded p-5 text-center bg-white">

<i
class="fa fa-cloud-upload-alt fa-4x text-primary mb-3"></i>

<h4>

Arrastre aquí el archivo Excel

</h4>

<p>

o

</p>

<button
class="btn btn-primary"
onclick="document.getElementById('archivoExcel').click()">

Seleccionar Archivo

</button>

<input
type="file"
id="archivoExcel"
accept=".xlsx,.xls,.csv"
hidden>

</div>

</div>

<div
id="archivoSeleccionado"
class="alert alert-secondary">

Ningún archivo seleccionado

</div>

<div class="progress mb-4">

<div
id="barraImportacion"
class="progress-bar progress-bar-striped progress-bar-animated"
style="width:0%">

0%

</div>

</div>

<div class="row text-center mb-4">

<div class="col">

<div class="card">

<div class="card-body">

<h3 id="totalRegistros">

0

</h3>

Registros

</div>

</div>

</div>

<div class="col">

<div class="card">

<div class="card-body">

<h3
class="text-success"
id="correctos">

0

</h3>

Correctos

</div>

</div>

</div>

<div class="col">

<div class="card">

<div class="card-body">

<h3
class="text-warning"
id="duplicados">

0

</h3>

Duplicados

</div>

</div>

</div>

<div class="col">

<div class="card">

<div class="card-body">

<h3
class="text-danger"
id="errores">

0

</h3>

Errores

</div>

</div>

</div>

</div>

<div class="table-responsive">

<table
class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>#</th>

<th>Nombre</th>

<th>Apellidos</th>

<th>Teléfono</th>

<th>Tipo</th>

<th>Estado</th>

</tr>

</thead>

<tbody id="vistaPrevia">

<tr>

<td
colspan="6"
class="text-center text-muted">

No hay información

</td>

</tr>

</tbody>

</table>

</div>

<div class="text-end mt-3">

<button
class="btn btn-secondary">

Cancelar

</button>

<button
class="btn btn-success">

Continuar

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="js/importador/importador_v2.js"></script>

</body>

</html>
