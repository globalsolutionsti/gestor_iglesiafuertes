<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Kiosko de Asistencia</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f5f7fb;
text-align:center;
padding:20px;
min-height:100vh;

}

h1{

font-size:3rem;
font-weight:bold;
margin-bottom:20px;

}

#reader{

width:100%;
max-width:800px;
margin:auto;

}

#selectorCamara{

max-width:400px;
margin:auto;

}

#mensaje{

margin-top:20px;
font-size:2rem;
font-weight:bold;
min-height:100px;

}

.ok{

color:green;

}

.error{

color:red;

}

/* ==========================
TABLETS (IPAD)
========================== */

@media (max-width:1024px){

h1{

font-size:2.5rem;

}

#mensaje{

font-size:1.8rem;

}

}

/* ==========================
CELULARES
========================== */

@media (max-width:768px){

body{

padding:10px;

}

h1{

font-size:2rem;

}

#reader{

max-width:100%;

}

#mensaje{

font-size:1.4rem;

min-height:80px;

}

h5{

font-size:1rem;

}

}

/* ==========================
CELULARES PEQUEÑOS
========================== */

@media (max-width:480px){

h1{

font-size:1.6rem;

}

#mensaje{

font-size:1.2rem;

}

}

.logo-conexion{

width:100%;
max-width:420px;
height:auto;

}

/* iPad */

@media (max-width:1024px){

.logo-conexion{

max-width:350px;

}

}

/* Celular */

@media (max-width:768px){

.logo-conexion{

max-width:280px;

}

}
  
</style>
</head>

<body>

<div class="mb-4">

<img
src="img/logo_conexion.png"
alt="Grupos Conexión"
class="logo-conexion">

</div>

<h1>

Registro de Asistencia vía QR

</h1>

<div class="mb-3">

<label class="form-label">

Seleccionar cámara

</label>

<select
id="selectorCamara"
class="form-select">

<option value="frontal">
Cámara Frontal
</option>

<option value="trasera">
Cámara Trasera
</option>

</select>

</div>
  
<div
id="reader"
class="shadow rounded bg-white p-2">
</div>

<div id="mensaje">

Esperando QR...

</div>

<div class="mt-4">

<h5>

Coloque su código QR frente a la cámara

</h5>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="js/config.js"></script>

<script src="js/qr_kiosko.js"></script>

</body>

</html>
