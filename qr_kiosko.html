<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Kiosko de Asistencia</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f5f7fb;
text-align:center;
padding:20px;
min-height:100vh;

}

body.success{

background:#d4edda !important;

transition:.3s;

}

body.errorbg{

background:#f8d7da !important;

transition:.3s;

}
  
h1{

font-size:3rem;
font-weight:bold;
margin-bottom:20px;

}

#reader{

width:100%;
max-width:800px;
max-height:550px;

margin:auto;

background:white;
border-radius:20px;
padding:10px;

overflow:hidden;

}

#reader video{

border-radius:15px;

width:100% !important;
height:auto !important;

}

#reader__scan_region{

padding:0 !important;

}

#reader__dashboard{

padding-top:10px;

}
  
#selectorCamara{

max-width:400px;
margin:auto;

}

#mensaje{

width:100%;
max-width:1000px;

margin:10px auto 15px auto;

padding:15px;

font-size:2rem;
font-weight:bold;

border-radius:15px;

background:white;

box-shadow:0 2px 8px rgba(0,0,0,.1);

min-height:80px;

display:flex;
align-items:center;
justify-content:center;

}

.ok{

color:green;

}

.error{

color:red;

}

/* ==========================
TABLETS (IPAD)
========================== */

@media (max-width:1024px){

body{

padding:5px;

}

h1{

font-size:2.2rem;

margin-bottom:10px;

}

#reader{

max-width:95vw;

}

#mensaje{

font-size:1.8rem;
min-height:70px;

}

}

/* ==========================
CELULARES
========================== */

@media (max-width:768px){

body{

padding:10px;

}

h1{

font-size:2rem;

}

#reader{

max-width:100%;

}

#mensaje{

font-size:1.3rem;

min-height:60px;

padding:10px;

}

h5{

font-size:1rem;

}

}

/* ==========================
CELULARES PEQUEÑOS
========================== */

@media (max-width:480px){

h1{

font-size:1.6rem;

}

#mensaje{

font-size:1.2rem;

}

}

.logo-conexion{

width:100%;
max-width:420px;
height:auto;

}

/* iPad */

@media (max-width:1024px){

.logo-conexion{

max-width:350px;

}

}

/* Celular */

@media (max-width:768px){

.logo-conexion{

max-width:280px;

}

}

/* ==========================
MODO KIOSKO
========================== */

@media (min-width:768px){

.logo-conexion{

max-width:320px;

}

#reader{

margin-top:0px;

}

#mensaje{

margin-top:10px;

}

}

/* ==========================
AJUSTE KIOSKO IPAD
========================== */

#reader{

display:flex;
align-items:flex-start;
justify-content:center;

}

/* mueve la región de escaneo hacia arriba */

#reader__scan_region{

display:flex !important;
align-items:flex-start !important;
justify-content:center !important;

padding-top:0 !important;
margin-top:-120px !important;

}  
  
</style>
</head>

<body>

<div class="mb-4">

<img
src="img/logo_conexion.png"
alt="Grupos Conexión"
class="logo-conexion">

</div>

<h1>

Registro de Asistencia vía QR

</h1>

<div class="mb-3">

<label class="form-label">

Seleccionar cámara

</label>

<select
id="selectorCamara"
class="form-select">

<option value="frontal">
Cámara Frontal
</option>

<option value="trasera">
Cámara Trasera
</option>

</select>

</div>
  
<div id="mensaje">

Esperando QR...

</div>

<button
class="btn btn-primary mt-2"
onclick="probarVoz()">

Probar Voz

</button>
  
<div
id="reader"
class="shadow rounded bg-white p-2">
</div>

<div class="mt-4">

<h5>

Coloque su código QR frente a la cámara

</h5>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="js/config.js"></script>

<script src="js/qr_kiosko.js"></script>

</body>

</html>
