<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Servidores</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="main-container">

<div class="sidebar">

<h2 class="logo-title">IGLESIA</h2>

<ul class="menu">

<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="servidores.html">Servidores</a></li>
<li><a href="eventos.html">Eventos</a></li>
<li><a href="asistencia.html">Asistencia QR</a></li>

</ul>

</div>

<div class="content">

<div class="topbar">

<h2>Gestión de Servidores</h2>

<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalServidor">

<i class="fa fa-plus"></i>
Nuevo Servidor

</button>

</div>

<div class="table-container">

<table id="tabla" class="table">

<thead>

<tr>

<th>Foto</th>
<th>Nombre</th>
<th>Ministerio</th>
<th>Grupo</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaServidores"></tbody>

</table>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal fade" id="modalServidor">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5>Nuevo Servidor</h5>

<button class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<div class="row">

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="numeroServidor"
placeholder="Número servidor">
</div>

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="nombre"
placeholder="Nombre">
</div>

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="apellidos"
placeholder="Apellidos">
</div>

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="telefono"
placeholder="Teléfono">
</div>

<div class="col-md-6 mb-3">
<input type="email"
class="form-control"
id="email"
placeholder="Email">
</div>

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="ministerio"
placeholder="Ministerio">
</div>

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
id="grupoConexion"
placeholder="Grupo conexión">
</div>

<div class="col-md-6 mb-3">
<input type="date"
class="form-control"
id="fechaIngreso">
</div>

<div class="col-md-12 mb-3">

<input type="text"
class="form-control"
id="foto"
placeholder="URL Foto">

</div>

</div>

</div>

<div class="modal-footer">

<button class="btn btn-primary"
onclick="guardarServidor()">

Guardar

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/config.js"></script>
<script src="js/servidores.js"></script>

</body>
</html>
