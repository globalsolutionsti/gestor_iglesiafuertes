<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Servidores</title>

<link rel="manifest" href="manifest.json">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="css/styles.css">

</head>

<body>

<div class="main-container">

<!-- SIDEBAR -->

<div class="sidebar">

<div>

<h2 class="logo-title">IGLESIA</h2>

<ul class="menu">

<li>
<a href="dashboard.html">
<i class="fa fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="servidores.html">
<i class="fa fa-users"></i>
Servidores
</a>
</li>

<li>
<a href="eventos.html">
<i class="fa fa-calendar"></i>
Eventos
</a>
</li>

<li>
<a href="asistencia.html">
<i class="fa fa-qrcode"></i>
Asistencia QR
</a>
</li>

</ul>

</div>

<div class="sidebar-user">

<img src="https://i.pravatar.cc/100">

<div>
<h6>Pastor General</h6>
<p>Administrador</p>
</div>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<div class="topbar">

<h2>Gestión de Servidores</h2>

<div class="d-flex gap-2">

<button class="btn btn-success"
onclick="exportarExcel()">

<i class="fa fa-file-excel"></i>
Excel

</button>

<button class="btn btn-danger"
onclick="exportarPDF()">

<i class="fa fa-file-pdf"></i>
PDF

</button>

<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalServidor">

<i class="fa fa-plus"></i>
Nuevo

</button>

</div>

</div>

<div class="table-container">

<table id="tabla"
class="table align-middle">

<thead>

<tr>

<th>Foto</th>
<th>Nombre</th>
<th>Ministerio</th>
<th>Grupo</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaServidores"></tbody>

</table>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal fade"
id="modalServidor">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5>Servidor</h5>

<button class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<div class="row">

<div class="col-md-6 mb-3">

<label>Número Servidor</label>

<input type="text"
class="form-control"
id="numeroServidor">

</div>

<div class="col-md-6 mb-3">

<label>Nombre</label>

<input type="text"
class="form-control"
id="nombre">

</div>

<div class="col-md-6 mb-3">

<label>Apellidos</label>

<input type="text"
class="form-control"
id="apellidos">

</div>

<div class="col-md-6 mb-3">

<label>Teléfono</label>

<input type="text"
class="form-control"
id="telefono">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input type="email"
class="form-control"
id="email">

</div>

<div class="col-md-6 mb-3">

<label>Ministerio</label>

<input type="text"
class="form-control"
id="ministerio">

</div>

<div class="col-md-6 mb-3">

<label>Grupo Conexión</label>

<input type="text"
class="form-control"
id="grupoConexion">

</div>

<div class="col-md-6 mb-3">

<label>Fecha Ingreso</label>

<input type="date"
class="form-control"
id="fechaIngreso">

</div>

<div class="col-md-12 mb-3">

<label>Foto URL</label>

<input type="text"
class="form-control"
id="foto">

</div>

</div>

</div>

<div class="modal-footer">

<button class="btn btn-primary"
onclick="guardarServidor()">

Guardar Servidor

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="js/config.js"></script>
<script src="js/servidores.js"></script>

</body>
</html>
