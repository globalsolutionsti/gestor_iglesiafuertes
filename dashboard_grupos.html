<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard de Grupos</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#f5f7fb;
}

.card-dashboard{
border:none;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.numero{
font-size:2rem;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<a
href="javascript:history.back()"
class="btn btn-secondary mb-4">

<i class="fa fa-arrow-left"></i>
Regresar

</a>

<h2 id="tituloTemporada">

Dashboard de Grupos

</h2>

<hr>

<div id="infoTemporada"></div>

<div class="row g-3 mb-4">

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-users fa-2x text-primary"></i>

<div class="numero"
id="totalParticipantes">

0

</div>

<div>
Participantes
</div>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-user-check fa-2x text-success"></i>

<div class="numero"
id="totalServidores">

0

</div>

<div>
Servidores
</div>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-user fa-2x text-info"></i>

<div class="numero"
id="totalCongregantes">

0

</div>

<div>
Congregantes
</div>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-star fa-2x text-warning"></i>

<div class="numero"
id="totalLideres">

0

</div>

<div>
Líderes
</div>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-cross fa-2x text-danger"></i>

<div class="numero"
id="totalPastores">

0

</div>

<div>
Pastores
</div>

</div>

</div>

</div>

<div class="col-md-2">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-sitemap fa-2x text-dark"></i>

<div class="numero"
id="totalCoordinadores">

0

</div>

<div>
Coordinadores
</div>

</div>

</div>

</div>

</div>

<div class="row">

<div class="row mt-4">

<div class="col-md-12">

<div class="card card-dashboard">

<div class="card-header">

Participantes por Sesión

</div>

<div class="card-body">

<table class="table table-striped">

<thead>

<tr>

<th>Sesión</th>
<th>Total Participantes</th>

</tr>

</thead>

<tbody id="tablaSesiones">

<tr>

<td colspan="2">

Cargando...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

  
<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-header">

Ranking de Grupos

</div>

<div class="card-body"
id="rankingGrupos">

Cargando...

</div>

</div>

</div>

<div class="col-md-8">

<div class="card card-dashboard">

<div class="card-header">

Detalle por Grupo

</div>

<div class="card-body">

<table
class="table table-bordered">

<thead>

<tr>

<th>Grupo</th>
<th>Total</th>

</tr>

</thead>

<tbody
id="tablaGrupos">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/dashboard_grupos.js"></script>

</body>
</html>
