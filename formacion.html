<div class="content">

<div class="topbar">

<h2>Niveles de Formación</h2>

<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalNivel">

<i class="fa fa-plus"></i>
Nuevo Nivel

</button>

</div>

<div class="table-container">

<table id="tablaNiveles"
class="table">

<thead>

<tr>

<th>Nivel</th>
<th>Descripción</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="bodyNiveles"></tbody>

</table>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal fade"
id="modalNivel">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Nuevo Nivel</h5>

<button class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<div class="mb-3">

<label>Nombre Nivel</label>

<input type="text"
class="form-control"
id="nombreNivel">

</div>

<div class="mb-3">

<label>Descripción</label>

<textarea class="form-control"
id="descripcionNivel"></textarea>

</div>

<div class="mb-3">

<label>Estado</label>

<select class="form-control"
id="estadoNivel">

<option>ACTIVO</option>
<option>INACTIVO</option>

</select>

</div>

</div>

<div class="modal-footer">

<button class="btn btn-primary"
onclick="guardarNivel()">

Guardar

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/formacion.js"></script>

<script>
function toggleSidebar(){

const sidebar =
document.querySelector(".sidebar");

const overlay =
document.getElementById("sidebarOverlay");

sidebar.classList.toggle("active");

overlay.classList.toggle("active");

}

/* =====================================================
CERRAR MENU AL CAMBIAR TAMAÑO
===================================================== */

window.addEventListener(
"resize",
function(){

if(window.innerWidth > 768){

const sidebar =
document.querySelector(".sidebar");

const overlay =
document.getElementById("sidebarOverlay");

if(sidebar){
sidebar.classList.remove("active");
}

if(overlay){
overlay.classList.remove("active");
}

}

}
);

</script>
