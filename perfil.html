<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Perfil</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="css/styles.css">

</head>

<body>

<div class="perfil-container">

<div class="perfil-card">

<div class="perfil-header">

<img id="fotoPerfil"
src="https://i.pravatar.cc/150"
class="perfil-img">

<div>

<h2 id="nombrePerfil"></h2>

<p id="ministerioPerfil"></p>

</div>

</div>

<div class="tabs">

<button class="tab-btn active">
Resumen
</button>

<button class="tab-btn">
Asistencias
</button>

<button class="tab-btn">
Formación
</button>

</div>

<div class="perfil-stats">

<div class="stat-box">
<h3>98%</h3>
<p>Asistencia</p>
</div>

<div class="stat-box">
<h3>12</h3>
<p>Eventos</p>
</div>

<div class="stat-box">
<h3>5</h3>
<p>Cursos</p>
</div>

</div>

<div class="qr-box">

<img id="qrPerfil">

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/perfil.js"></script>

</body>
</html>
