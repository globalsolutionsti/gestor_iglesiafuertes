<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Perfil Servidor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="main-content">

<div class="container-fluid">

<div class="perfil-header">

<div class="perfil-cover"></div>

<div class="perfil-info">

<img id="fotoServidor"
class="perfil-avatar">

<div>

<h2 id="nombreServidor"></h2>

<p id="ministerioServidor"></p>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-lg-4">

<div class="card-custom">

<h5>Información General</h5>

<hr>

<p>
<strong>Número:</strong>
<span id="numeroServidor"></span>
</p>

<p>
<strong>Email:</strong>
<span id="emailServidor"></span>
</p>

<p>
<strong>Teléfono:</strong>
<span id="telefonoServidor"></span>
</p>

<p>
<strong>Grupo:</strong>
<span id="grupoServidor"></span>
</p>

<p>
<strong>Ingreso:</strong>
<span id="fechaIngreso"></span>
</p>

</div>

</div>

<div class="col-lg-8">

<div class="card-custom">

<ul class="nav nav-tabs">

<li class="nav-item">

<button class="nav-link active"
data-bs-toggle="tab"
data-bs-target="#asistencias">

Asistencias

</button>

</li>

<li class="nav-item">

<button class="nav-link"
data-bs-toggle="tab"
data-bs-target="#formacion">

Formación

</button>

</li>

</ul>

<div class="tab-content mt-4">

<div class="tab-pane fade show active"
id="asistencias">

<div id="historialAsistencias"></div>

</div>

<div class="tab-pane fade"
id="formacion">

<div id="historialFormacion"></div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/config.js"></script>

<script src="js/perfil.js"></script>

</body>

</html>
