<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Iglesia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

</head>

<body class="login-body">

<div class="login-container">

<div class="login-card">

<div class="text-center mb-4">

<h2 class="logo-title">IGLESIA</h2>
<p class="text-light">Gestión de Servidores</p>

</div>

<form id="loginForm">

<div class="mb-3">
<input type="email" class="form-control form-dark" id="email" placeholder="Usuario">
</div>

<div class="mb-3">
<input type="password" class="form-control form-dark" id="password" placeholder="Contraseña">
</div>

<button class="btn btn-primary btn-login w-100">
Iniciar Sesión
</button>

</form>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>
</html>
