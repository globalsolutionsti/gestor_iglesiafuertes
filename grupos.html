<!-- CONTENIDO -->

<div class="content">

<div class="topbar">

<h2>Grupos Conexión</h2>

<button
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalTemporada">

<i class="fa fa-plus"></i>
Agregar Temporada

</button>

</div>

<div class="table-container">

<table class="table">

<thead>

<tr>

<th>ID</th>
<th>Temporada</th>
<th>Año</th>
<th>Grupo</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="tablaTemporadas">

<tr>
<td colspan="5">
Cargando...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal fade"
id="modalTemporada">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Nueva Temporada</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<label>Temporada</label>

<select
id="temporada"
class="form-select mb-3">

<option>1ra Temporada</option>
<option>2da Temporada</option>
<option>3ra Temporada</option>
<option>4ta Temporada</option>

</select>

<label>Año</label>

<input
type="number"
id="anio"
class="form-control mb-3"
value="2026">

<label>Grupo</label>

<select
id="grupo"
class="form-select">

<option>Cargando...</option>

</select>

</div>

<div class="modal-footer">

<button
class="btn btn-primary"
onclick="guardarTemporada()">

Guardar

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
