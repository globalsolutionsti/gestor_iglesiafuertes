<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard de Asistencias</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#f5f7fb;
}

.card-dashboard{
border:none;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.numero{
font-size:2rem;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<a
href="javascript:history.back()"
class="btn btn-secondary mb-4">

<i class="fa fa-arrow-left"></i>
Regresar

</a>

<h2>

Dashboard de Asistencias

</h2>

<hr>

<div class="row g-3 mb-4">

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-clipboard-list fa-2x text-primary"></i>

<div
class="numero"
id="totalRegistros">

0

</div>

<div>
Registros
</div>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-user-check fa-2x text-success"></i>

<div
class="numero"
id="totalAsistencias">

0

</div>

<div>
Asistencias
</div>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-body text-center">

<i class="fa fa-chart-line fa-2x text-warning"></i>

<div
class="numero"
id="porcentajeGeneral">

0%

</div>

<div>
Asistencia General
</div>

</div>

</div>

</div>

</div>

<div class="row">

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-header">

Ranking de Grupos

</div>

<div
class="card-body"
id="rankingGrupos">

Cargando...

</div>

</div>

</div>

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-header">

Asistencia por Sesión

</div>

<div
class="card-body"
id="rankingSesiones">

Cargando...

</div>

</div>

</div>

<div class="col-md-4">

<div class="card card-dashboard">

<div class="card-header">

Participantes Destacados

</div>

<div
class="card-body"
id="rankingPersonas">

Cargando...

</div>

</div>

</div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/dashboard_asistencias.js"></script>

</body>
</html>
